<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MITRA CampusLive Demo</title>
<style>
:root{
  --bg:#0e1b18;--panel:#14261f;--card:#1b3129;--line:#2c463c;
  --amber:#e8a33d;--sage:#7ba88c;--coral:#d9694f;--paper:#f2efe6;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}.app{min-height:100vh}
.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{font:22px Georgia,serif}.user{display:flex;align-items:center;gap:12px;font-size:13px}
.role{padding:5px 9px;border-radius:20px;background:#e8a33d22;color:var(--amber);text-transform:uppercase;font-size:10px;letter-spacing:1px}
.ghost,.primary{border-radius:8px;padding:9px 13px;cursor:pointer}.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}.primary{background:var(--amber);border:0;color:var(--bg);font-weight:700}
.pulse{height:42px;border-bottom:1px solid var(--line);background:#101f1b;display:flex;align-items:center;gap:14px;padding:0 24px;font:12px monospace}
.bars{display:flex;align-items:end;gap:4px;height:20px;flex:1}.bar{flex:1;max-width:60px;border-radius:2px;background:var(--sage);height:6px}.bar.on{height:18px;background:var(--coral)}.bar.maint{height:11px;background:var(--amber)}
.layout{display:flex;min-height:calc(100vh - 106px)}
.sidebar{width:215px;border-right:1px solid var(--line);padding:18px 10px}
.nav{width:100%;border:0;background:transparent;color:#f2efe6cc;text-align:left;padding:11px 12px;border-radius:8px;margin-bottom:5px;cursor:pointer}
.nav.active{background:var(--card);color:var(--amber)}.content{flex:1;padding:24px;overflow:auto}
.title{font:24px Georgia,serif;margin:0}.sub{font-size:12px;opacity:.6;margin:5px 0 20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat .label{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px}.stat .value{font-size:25px;margin-top:7px;font-weight:700}.ok{color:var(--sage)}.bad{color:var(--coral)}.warn{color:var(--amber)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{padding:16px}.panel h3{font:18px Georgia,serif;margin:0 0 14px}.map{height:350px;position:relative;background:#10211b;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.building{position:absolute;background:#1b3129;border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;font-size:12px;transition:.2s}.building:hover,.building.sel{border-color:var(--amber);background:#e8a33d22}.building small{display:block;opacity:.6;margin-top:5px}
.energy{height:12px;background:#0e1b18;border-radius:20px;overflow:hidden;margin:8px 0}.energy i{display:block;height:100%;background:var(--amber);border-radius:20px}
.roomlist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.room{padding:11px;background:var(--card);border-radius:9px;border:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;padding:4px 7px;border-radius:20px;height:max-content}.avail{color:var(--sage);background:#7ba88c22}.occ{color:var(--coral);background:#d9694f22}.maint{color:var(--amber);background:#e8a33d22}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2c463c88;font-size:13px}.row:last-child{border:0}.muted{opacity:.6;font-size:11px}
.form{display:grid;gap:10px;max-width:520px}.form input,.form select{background:#0e1b18;color:var(--paper);border:1px solid var(--line);padding:10px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.notice{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.chart{height:180px;display:flex;align-items:end;gap:10px;padding:10px 4px}.col{flex:1;background:var(--amber);border-radius:4px 4px 0 0;min-height:12px}.legend{font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#1b3129 0,transparent 35%),var(--bg)}.loginbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}.loginbox h1{font:28px Georgia,serif;margin:0 0 6px}.loginbox p{opacity:.65;font-size:13px;margin-bottom:22px}.userchoice{border:1px solid var(--line);padding:12px;border-radius:10px;margin:8px 0;cursor:pointer;display:flex;justify-content:space-between}.userchoice.sel{border-color:var(--amber);background:var(--card)}.loginbox .primary{width:100%;margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{width:175px}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.sidebar{width:64px;padding:12px 7px}.nav{font-size:0;text-align:center}.nav:first-letter{font-size:18px}.content{padding:15px}.grid,.cards,.roomlist{grid-template-columns:1fr}.topbar{padding:0 12px}.brand{font-size:18px}.user span:not(.role){display:none}.pulse{padding:0 12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const users=[
{id:'u1',name:'Srushti Patil',role:'student',email:'srushti@campus.edu'},
{id:'u2',name:'Prof. Kadam',role:'faculty',email:'kadam@campus.edu'},
{id:'u3',name:'Admin Office',role:'admin',email:'admin@campus.edu'}
];
const buildings=[
{id:'A',name:'Academic Block A',x:8,y:12,w:26,h:20,rooms:['A-101','A-102','A-201']},
{id:'B',name:'Academic Block B',x:40,y:10,w:24,h:16,rooms:['B-101','B-102']},
{id:'LIB',name:'Central Library',x:70,y:14,w:22,h:18,rooms:[]},
{id:'LAB',name:'Computer Labs',x:10,y:45,w:22,h:18,rooms:['LAB-1','LAB-2']},
{id:'SEM',name:'Seminar Hall',x:40,y:40,w:20,h:14,rooms:['SEM-1']},
{id:'ADM',name:'Admin Building',x:68,y:45,w:22,h:16,rooms:[]},
{id:'CAF',name:'Cafeteria',x:10,y:72,w:20,h:14,rooms:[]},
{id:'AUD',name:'Auditorium',x:40,y:68,w:24,h:18,rooms:['AUD-MAIN']}
];
let rooms=[
{id:'A-101',building:'A',capacity:60,status:'Available'},
{id:'A-102',building:'A',capacity:60,status:'Occupied'},
{id:'A-201',building:'A',capacity:40,status:'Maintenance'},
{id:'B-101',building:'B',capacity:80,status:'Available'},
{id:'B-102',building:'B',capacity:80,status:'Occupied'},
{id:'LAB-1',building:'LAB',capacity:30,status:'Available'},
{id:'LAB-2',building:'LAB',capacity:30,status:'Occupied'},
{id:'SEM-1',building:'SEM',capacity:50,status:'Available'},
{id:'AUD-MAIN',building:'AUD',capacity:300,status:'Available'}
];
let current=null,view='overview',selected=null,bookings=[],attendance=[],tickets=[],notices=[
{title:'Welcome to MITRA CampusLive',body:'Your digital campus twin is live.',from:'System'}
];

function render(){
if(!current){renderLogin();return}
const occupied=rooms.filter(r=>r.status==='Occupied').length;
const pct=Math.round(occupied/rooms.length*100);
document.getElementById('root').innerHTML=`
<div class="app">
<div class="topbar"><div class="brand">MITRA CampusLive</div><div class="user"><span class="role">${current.role}</span><span>${current.name}</span><button class="ghost" onclick="logout()">Sign out</button></div></div>
<div class="pulse"><span>LIVE CAMPUS OCCUPANCY ${pct}%</span><div class="bars">${rooms.map(r=>`<i class="bar ${r.status==='Occupied'?'on':r.status==='Maintenance'?'maint':''}"></i>`).join('')}</div></div>
<div class="layout"><aside class="sidebar">${nav('📍','Campus Map','overview')}${nav('🗓','Room Booking','booking')}${nav('🚪','Room Status','status')}${nav('☑','Attendance','attendance')}${nav('🔧','Maintenance','tickets')}${nav('📊','Analytics','analytics')}${nav('🔔','Notifications','notifications')}${nav('📄','Reports','reports')}${current.role==='admin'?nav('📜','Activity Logs','logs'):''}</aside><main class="content">${page()}</main></div>
</div>`;
}
function nav(icon,label,key){return `<button class="nav ${view===key?'active':''}" onclick="go('${key}')">${icon} &nbsp;${label}</button>`}
function page(){
if(view==='overview')return overview();
if(view==='booking')return booking();
if(view==='status')return statusPage();
if(view==='attendance')return attendancePage();
if(view==='tickets')return ticketsPage();
if(view==='analytics')return analytics();
if(view==='notifications')return notificationsPage();
if(view==='reports')return reports();
return logsPage();
}
function overview(){
const occ=rooms.filter(r=>r.status==='Occupied').length;
return `<h1 class="title">Campus Map</h1><p class="sub">Select a building to view its rooms and live status.</p>
<div class="grid">
${stat('🏫','Total Rooms',rooms.length,'')}${stat('🟢','Available',rooms.filter(r=>r.status==='Available').length,'ok')}${stat('🔴','Occupied',occ,'bad')}${stat('⚠','Maintenance',rooms.filter(r=>r.status==='Maintenance').length,'warn')}
</div>
<div class="two"><section class="panel"><h3>Campus Map</h3><div class="map">${buildings.map(b=>`<div class="building ${selected===b.id?'sel':''}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%" onclick="selectBuilding('${b.id}')">${b.name}<small>${b.rooms.length?b.rooms.filter(id=>rooms.find(r=>r.id===id)?.status==='Occupied').length+'/'+b.rooms.length+' occupied':'Campus facility'}</small></div>`).join('')}</div></section>
<section class="panel"><h3>${selected?buildings.find(b=>b.id===selected).name:'Campus Snapshot'}</h3>${selected?buildingRooms():snapshot()}</section></div>`;
}
function snapshot(){return `<div class="row"><span>Campus energy</span><b class="warn">184.6 kW</b></div><div class="row"><span>Today's consumption</span><b>1,842 kWh</b></div><div class="row"><span>Cafeteria crowd</span><b class="warn">🟡 Medium · 68</b></div><div class="row"><span>Active buses</span><b class="ok">6</b></div><div class="row"><span>Next class</span><b>02:00 PM · A-204</b></div>`}
function buildingRooms(){let b=buildings.find(x=>x.id===selected);let rs=rooms.filter(r=>r.building===b.id);return rs.length?rs.map(roomHTML).join(''):`<p class="muted">No bookable rooms registered here.</p>`}
function roomHTML(r){let c=r.status==='Available'?'avail':r.status==='Occupied'?'occ':'maint';return `<div class="room"><div><b>${r.id}</b><div class="muted">Capacity ${r.capacity}</div></div><span class="badge ${c}">${r.status}</span></div>`}
function stat(icon,label,value,cls){return `<div class="stat"><div class="label">${icon} ${label}</div><div class="value ${cls}">${value}</div></div>`}
function booking(){return `<h1 class="title">Room Booking</h1><p class="sub">Reserve an available room for a class or campus activity.</p><div class="two"><section class="panel"><div class="form"><select id="room">${rooms.filter(r=>r.status!=='Maintenance').map(r=>`<option>${r.id} (cap ${r.capacity})</option>`).join('')}</select><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><div style="display:flex;gap:10px"><input id="start" type="time" value="10:00"><input id="end" type="time" value="11:00"></div><input id="purpose" placeholder="e.g. DBMS lecture"><button class="primary" onclick="addBooking()">Confirm booking</button></div></section><section class="panel"><h3>Upcoming / Recent Bookings</h3>${bookings.length?bookings.map(b=>`<div class="row"><span><b>${b.room} · ${b.purpose}</b><br><span class="muted">${b.date} · ${b.start}–${b.end} · by ${b.by}</span></span></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</section></div>`}
function statusPage(){return `<h1 class="title">Room Status</h1><p class="sub">Live simulated occupancy across campus rooms.</p><div class="roomlist">${rooms.map(roomHTML).join('')}</div>`}
function attendancePage(){let total=attendance.length,p=attendance.filter(a=>a.present).length,pct=total?Math.round(p/total*100):0;return `<h1 class="title">Attendance Management</h1><p class="sub">Overall attendance: ${pct}% (${p}/${total})</p>${current.role!=='student'?`<section class="panel" style="margin-bottom:16px"><div class="form"><input id="subject" placeholder="Subject"><input id="student" placeholder="Student name"><select id="present"><option value="1">Present</option><option value="0">Absent</option></select><button class="primary" onclick="markAttendance()">Mark Attendance</button></div></section>`:''}<section class="panel">${attendance.length?attendance.map(a=>`<div class="row"><span><b>${a.student} — ${a.subject}</b><br><span class="muted">${a.date} · marked by ${a.by}</span></span><span class="${a.present?'ok':'bad'}">${a.present?'✓ Present':'✕ Absent'}</span></div>`).join(''):'<p class="muted">No attendance records yet.</p>'}</section>`}
function ticketsPage(){return `<h1 class="title">Maintenance</h1><p class="sub">Report room issues and track resolution.</p><section class="panel" style="margin-bottom:16px"><div class="form"><select id="ticketroom">${rooms.map(r=>`<option>${r.id}</option>`).join('')}</select><input id="issue" placeholder="Describe the issue"><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><button class="primary" onclick="addTicket()">Raise Ticket</button></div></section><section class="panel">${tickets.length?tickets.map((t,i)=>`<div class="row"><span><b>${t.room} — ${t.issue}</b><br><span class="muted">${t.priority} priority · ${t.by}</span></span>${current.role==='admin'?`<select onchange="setTicket(${i},this.value)"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Resolved'?'selected':''}>Resolved</option></select>`:`<span class="badge warn">${t.status}</span>`}</div>`).join(''):'<p class="muted">No maintenance tickets.</p>'}</section>`}
function analytics(){let values=[32,48,41,65,52,76,61,88,72,95];return `<h1 class="title">Analytics</h1><p class="sub">Campus utilization and activity overview.</p><div class="cards">${stat('📅','Bookings',bookings.length,'')}${stat('☑','Attendance',attendance.length?'Tracked':'No data','')}${stat('🔧','Tickets',tickets.length,'')}</div><section class="panel" style="margin-top:16px"><h3>Campus Activity</h3><div class="chart">${values.map(v=>`<div class="col" style="height:${v}%"></div>`).join('')}</div><div class="legend"><span>8 AM</span><span>10 AM</span><span>12 PM</span><span>2 PM</span><span>4 PM</span><span>6 PM</span></div></section><div class="two"><section class="panel"><h3>Energy</h3><div class="row"><span>Current usage</span><b class="warn">184.6 kW</b></div><div class="row"><span>Highest classroom</span><b>A-204 · 6.1 kWh</b></div><div class="row"><span>Highest lab</span><b>LAB-1 · 8.4 kWh</b></div></section><section class="panel"><h3>Occupancy</h3>${rooms.map(r=>`<div class="muted" style="margin-top:8px">${r.id} <span style="float:right">${r.status}</span></div><div class="energy"><i style="width:${r.status==='Occupied'?85:r.status==='Maintenance'?35:15}%"></i></div>`).join('')}</section></div>`}
function notificationsPage(){return `<h1 class="title">Notifications</h1><p class="sub">Campus announcements and alerts.</p>${current.role!=='student'?`<section class="panel" style="margin-bottom:16px"><div class="form"><input id="ntitle" placeholder="Title"><input id="nbody" placeholder="Message"><button class="primary" onclick="addNotice()">Post Announcement</button></div></section>`:''}<div>${notices.map(n=>`<div class="notice"><b>${n.title}</b><div style="margin-top:4px;opacity:.75">${n.body}</div><div class="muted" style="margin-top:5px">${n.from}</div></div>`).join('')}</div>`}
function reports(){return `<h1 class="title">Reports</h1><p class="sub">Export a quick campus activity report.</p><section class="panel"><button class="primary" onclick="downloadCSV()">Download CSV Report</button><p class="muted" style="margin-top:12px">Demo browser export. The full React version can use XLSX/PDF libraries.</p></section>`}
function logsPage(){return `<h1 class="title">Activity Logs</h1><p class="sub">Admin-only activity history.</p><section class="panel"><div class="row"><span>System</span><span class="muted">CampusLive initialized</span></div><div class="row"><span>${current.name}</span><span class="muted">Signed in as ${current.role}</span></div></section>`}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>MITRA CampusLive</h1><p>Digital campus twin — sign in with your role.</p>${users.map((u,i)=>`<div class="userchoice ${i===0?'sel':''}" id="u-${u.id}" onclick="choose('${u.id}')"><span><b>${u.name}</b><br><small>${u.email}</small></span><span class="role">${u.role}</span></div>`).join('')}<button class="primary" onclick="login()">Sign in</button></div></div>`;window.selectedUser=users[0]}
function choose(id){window.selectedUser=users.find(u=>u.id===id);document.querySelectorAll('.userchoice').forEach(x=>x.classList.remove('sel'));document.getElementById('u-'+id).classList.add('sel')}
function login(){current=window.selectedUser;render()}
function logout(){current=null;view='overview';render()}
function go(v){view=v;render()}
function selectBuilding(id){selected=id;render()}
function addBooking(){let room=document.getElementById('room').value.split(' ')[0];let b={room,date:document.getElementById('date').value,start:document.getElementById('start').value,end:document.getElementById('end').value,purpose:document.getElementById('purpose').value,by:current.name};if(!b.purpose)return alert('Enter a purpose');bookings.unshift(b);let r=rooms.find(x=>x.id===room);if(r)r.status='Occupied';render()}
function markAttendance(){let s=document.getElementById('subject').value,st=document.getElementById('student').value;if(!s||!st)return alert('Enter subject and student');attendance.unshift({subject:s,student:st,date:new Date().toISOString().slice(0,10),present:document.getElementById('present').value==='1',by:current.name});render()}
function addTicket(){let issue=document.getElementById('issue').value;if(!issue)return alert('Describe the issue');tickets.unshift({room:document.getElementById('ticketroom').value,issue,priority:document.getElementById('priority').value,status:'Open',by:current.name});render()}
function setTicket(i,s){tickets[i].status=s;render()}
function addNotice(){let title=document.getElementById('ntitle').value,body=document.getElementById('nbody').value;if(!title)return alert('Enter a title');notices.unshift({title,body,from:current.name});render()}
function downloadCSV(){let data=['Room,Building,Capacity,Status',...rooms.map(r=>`${r.id},${r.building},${r.capacity},${r.status}`)].join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='MITRA_CampusLive_Report.csv';a.click()}
setInterval(()=>{if(current){let idx=Math.floor(Math.random()*rooms.length);if(rooms[idx].status!=='Maintenance')rooms[idx].status=Math.random()>.5?'Occupied':'Available';render()}},7000);
render();
</script>
</body>
</html>
